name: Check generated agents and plugins

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/sync_codex_agents.py --check
      - run: python scripts/sync_plugins.py --check
      - run: python -m unittest discover -s scripts -p "test_*.py"

  publication:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check published packages and both marketplace catalogs
        env:
          GH_TOKEN: ${{ secrets.MARKETPLACE_READ_TOKEN }}
        shell: bash
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Set MARKETPLACE_READ_TOKEN with contents:read access to both private repositories."
            exit 1
          fi
          python scripts/check_published_plugins.py
